name: Genereaza plan zilnic Carmonela
on:
  schedule:
    - cron: '15 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Genereaza plan
        run: python scripts/generate_daily_plan.py
      - name: Salveaza planul daca s-a schimbat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan-zilnic.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizare plan organic zilnic"
            git push
          fi
